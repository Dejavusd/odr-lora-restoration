experiment:
  name: odr_lora_LSRW_RainH_effective_r16
  output_dir: ./outputs/lsrw_rainh_effective_r16
  seed: 42
  device: cuda

data:
  root: ./data
  tasks:
    - name: lowlight
      dataset: LSRW
      train_split: train
      val_split: test
      patch_size: 128
      batch_size: 8

    - name: rainh
      dataset: RainH
      train_split: train
      val_split: test
      patch_size: 128
      batch_size: 8
model:
  backbone: NAFNet

  base_channels: 16
  num_blocks: [2, 4, 8, 4, 2]
  kernel_size: 3
  share_rank: 8
  private_rank_base: 8
  new_task_private_rank_base: 16
  rank_gamma: 1.5
  rank_min: 4
  rank_max: 32

odr_lora:
  full_update_protection: true
  basis_construction: projected_svd
  basis_rank_tolerance: 1.0e-5
  gpm_max_basis: 32
  gpm_statistics: frequency
  spatial_blocks: [2, 2]
  spatial_sample_ratio: 0.1
  freq_level: 2          # 1 -> 4 子带；2 -> 7 子带
  freq_bands: 7          # 与 freq_level=2 对应
  freq_decomp: dwt       # 使用多级 Haar DWT
  adaptive_lambda_min: 0.5
  adaptive_lambda_max: 1.0
  skip_orthogonal: true
  share_subspace: true


train:
  epochs_per_task: 400
  lr: 2.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 10
  grad_clip: 1.0
  loss:
    l1: 1.0
    perceptual: 0.1

eval:
  metrics: [psnr, ssim, lpips]
  save_images: false
