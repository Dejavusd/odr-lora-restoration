name: odr-lora
variables:
  PYTHONNOUSERSITE: '1'
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=11.8
  - mkl=2023.1.0
  - intel-openmp=2023.1.0
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.13.1
      - opencv-python==4.10.0.84
      - PyYAML==6.0.2
      - tqdm==4.66.5
      - lpips==0.1.4
      - scikit-image==0.24.0
      - matplotlib==3.9.4
